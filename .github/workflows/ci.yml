name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24', '1.23']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Test race
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

  test-32bit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: ['386', 'arm']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: go build ./...
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}

      # 386 binaries run natively on the amd64 runner; arm ones do not.
      - name: Test
        if: matrix.goarch == '386'
        run: go test ./...
        env:
          GOARCH: ${{ matrix.goarch }}
